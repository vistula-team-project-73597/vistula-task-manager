<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Task Manager</h1>
      <p>Vistula Student ID: <span id="student-id">73597</span></p>
    </header>
    <section aria-labelledby="form-heading">
      <h2 id="form-heading">Add a task</h2>
      <form id="task-form">
        <label for="task-title">Title</label>
        <input id="task-title" name="title" type="text" required>
        <label for="task-description">Description</label>
        <textarea id="task-description" name="description" rows="3"></textarea>
        <div class="actions">
          <button id="task-submit" type="submit" disabled>Add task</button>
          <button id="cancel-edit" class="secondary" type="button" hidden>Cancel editing</button>
        </div>
      </form>
    </section>
    <p id="status-message" role="status" aria-live="polite">Loading tasks…</p>
    <section aria-labelledby="tasks-heading">
      <h2 id="tasks-heading">Tasks</h2>
      <div id="task-list" aria-busy="true"></div>
    </section>
    <footer>
      <a id="contribution-link" href="contribution.html">Team Contribution</a>
    </footer>
  </main>
</body>
</html>
